name: Run LeadScope

on:
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LeadScope
        run: |
          python pipeline.py \
            berlin_tattoo_studios_2026_active_leads-2.xlsx \
            -o berlin_tattoo_studios_2026_leadscope_enriched.xlsx \
            --workers 8

      - name: Upload enriched lead list
        uses: actions/upload-artifact@v4
        with:
          name: berlin-tattoo-leadscope-enriched
          path: berlin_tattoo_studios_2026_leadscope_enriched.xlsx
